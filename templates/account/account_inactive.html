{% extends 'base.html' %}
{% block title %}Account Inactive{% endblock %}

{% block content %}

<style>
  .auth-wrapper {
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .auth-card {
    border-radius: var(--radius-modal);
    width: 100%;
    max-width: 420px;
    padding: 32px 28px;
    box-shadow: var(--shadow-lift);
    text-align: center;
  }

  .auth-card .inactive-icon {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--color-primary-soft);
    color: var(--color-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    margin: 0 auto 18px;
  }

  .auth-title {
    font-weight: 700;
    font-size: 1.6rem;
    color: var(--color-text);
    margin-bottom: 8px;
    letter-spacing: -0.01em;
  }

  .auth-subtitle {
    font-size: 0.95rem;
    color: var(--color-text-muted);
    margin-bottom: 20px;
    line-height: 1.5;
  }
</style>

<div class="auth-wrapper">
  <div class="card auth-card fade-in">
    <div class="card-body p-4">

      <div class="inactive-icon">
        <i class="bi bi-person-x-fill"></i>
      </div>

      <h4 class="auth-title">Account Inactive</h4>

      {% for message in messages %}
        <div class="alert alert-danger">{{ message }}</div>
      {% empty %}
        <p class="auth-subtitle">This account is inactive.</p>
      {% endfor %}

      <a href="{% url 'login' %}" class="btn btn-primary w-100">Back to Sign In</a>

    </div>
  </div>
</div>

{% endblock %}
