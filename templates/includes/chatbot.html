{% load static %}
<div id="chatbot-icon">
  {% if active_theme.is_kids_world and active_theme.mascot_illustration %}
    <img src="{% static active_theme.mascot_illustration %}" alt="" class="kw-chat-mascot">
  {% else %}
    <i class="bi bi-chat-dots-fill"></i>
  {% endif %}
</div>

<div id="chatbot-box" class="d-none">
  <div class="chat-header">
    <span class="chat-header-title">
      {% if active_theme.is_kids_world and active_theme.mascot_illustration %}
        <img src="{% static active_theme.mascot_illustration %}" alt="" class="kw-chat-mascot kw-chat-mascot-sm"> Buddy the Mentor
      {% else %}
        <i class="bi bi-stars"></i> AI Mentor
      {% endif %}
    </span>
    <button type="button" id="chat-close-btn" aria-label="Close chat">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>

  <div id="chat-messages" class="chat-body"></div>

  <div class="chat-input">
    <input type="text" id="chat-input" placeholder="Ask about your career or this site..." autocomplete="off" />
    <button id="send-btn" aria-label="Send message"><i class="bi bi-send-fill"></i></button>
  </div>
</div>
