{% extends 'base.html' %}
{% load socialaccount %}
{% block title %}Login{% endblock %}

{% block content %}

<style>
  /* ==============================
     AUTH WRAPPER
  ============================== */
  .auth-wrapper {
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  /* ==============================
     AUTH CARD
  ============================== */
  .auth-card {
    border-radius: var(--radius-modal);
    width: 100%;
    max-width: 420px;
    padding: 32px 28px;
    box-shadow: var(--shadow-lift);
  }

  /* ==============================
     AUTH TITLES
  ============================== */
  .auth-title {
    font-weight: 700;
    font-size: 1.6rem;
    color: var(--color-text);
    margin-bottom: 8px;
    text-align: center;
    letter-spacing: -0.01em;
  }

  .auth-subtitle {
    font-size: 0.95rem;
    color: var(--color-text-muted);
    text-align: center;
    margin-bottom: 24px;
    line-height: 1.5;
  }

  .auth-card .btn {
    width: 100%;
  }

  /* ==============================
     DIVIDER
  ============================== */
  .auth-divider {
    display: flex;
    align-items: center;
    text-align: center;
    color: var(--color-text-muted);
    font-size: 0.8rem;
    margin: 20px 0;
  }

  .auth-divider::before,
  .auth-divider::after {
    content: '';
    flex: 1;
    border-bottom: 1px solid var(--color-border);
  }

  .auth-divider:not(:empty)::before {
    margin-inline-end: 12px;
  }

  .auth-divider:not(:empty)::after {
    margin-inline-start: 12px;
  }

  /* ==============================
     SOCIAL BUTTONS
  ============================== */
  .btn-google {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    border-radius: var(--radius-btn);
    padding: 11px;
    font-weight: 600;
    font-size: 0.95rem;
    background: var(--color-surface);
    color: var(--color-text);
    border: 1px solid var(--color-border);
    cursor: pointer;
    text-decoration: none;
    transition: background var(--transition), box-shadow var(--transition), transform var(--transition);
  }

  .btn-google:hover {
    background: var(--color-primary-soft);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    transform: translateY(-2px);
    color: var(--color-text);
  }

  .btn-google svg {
    flex-shrink: 0;
  }

  /* ==============================
     PASSWORD FIELD (show/hide)
  ============================== */
  .password-field {
    position: relative;
  }

  .password-field .form-control {
    padding-inline-end: 42px;
  }

  .password-field .toggle-password-icon {
    position: absolute;
    top: 50%;
    inset-inline-end: 14px;
    transform: translateY(-50%);
    cursor: pointer;
    color: var(--color-text-muted);
    font-size: 1.05rem;
  }
</style>

<div class="auth-wrapper">
  <div class="card auth-card fade-in">
    <div class="card-body p-4">

      <div class="text-center mb-4">
        <h4 class="auth-title mb-1">Welcome Back</h4>
        <p class="auth-subtitle">Sign in to continue learning</p>
      </div>

      {% for message in messages %}
        <div class="alert alert-danger">
          {{ message }}
        </div>
      {% endfor %}

      <form method="post">
        {% csrf_token %}

        <div class="mb-3">
          <input name="username"
                 class="form-control"
                 placeholder="Username or Email"
                 required>
        </div>

        <div class="mb-3 password-field">
          <input name="password"
                 type="password"
                 id="loginPassword"
                 class="form-control"
                 placeholder="Password"
                 required>
          <i class="bi bi-eye-slash toggle-password-icon" onclick="togglePasswordField('loginPassword', this)"></i>
        </div>

        <button class="btn btn-primary w-100">
          Login
        </button>
      </form>

      <div class="auth-divider">OR</div>

      <a href="{% provider_login_url 'google' %}" class="btn-google">
        <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.71v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.61z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.85.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.97 10.72A5.4 5.4 0 0 1 3.68 9c0-.6.1-1.18.29-1.72V4.95H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.05l3.01-2.33z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>
        </svg>
        Continue with Google
      </a>

      <p class="text-center mt-4" style="font-size: 0.9rem; color: var(--color-text-muted);">
        Don't have an account?
        <a href="{% url 'register' %}" style="color: var(--color-primary); font-weight: 600; text-decoration: none;">Sign up</a>
      </p>

    </div>
  </div>
</div>

<script>
  function togglePasswordField(inputId, icon) {
    const input = document.getElementById(inputId);
    const isHidden = input.type === 'password';
    input.type = isHidden ? 'text' : 'password';
    icon.classList.toggle('bi-eye', isHidden);
    icon.classList.toggle('bi-eye-slash', !isHidden);
  }
</script>

{% endblock %}
